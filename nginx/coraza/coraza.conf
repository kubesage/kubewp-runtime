# Coraza WAF main configuration
# Start in DetectionOnly mode - switch to On after tuning (per RESEARCH.md Pitfall 2)
SecRuleEngine DetectionOnly

# Request body handling
SecRequestBodyAccess On
SecRequestBodyLimit 268435456
SecRequestBodyNoFilesLimit 131072
SecRequestBodyLimitAction Reject

# Response body handling (disable for performance)
SecResponseBodyAccess Off

# Temp file paths
SecTmpDir /tmp/coraza
SecDataDir /tmp/coraza

# Logging
SecAuditEngine RelevantOnly
SecAuditLogRelevantStatus "^(?:5|4(?!04))"
SecAuditLog /var/log/nginx/coraza-audit.log
SecAuditLogType Serial

# Default action
SecDefaultAction "phase:1,log,auditlog,pass"
SecDefaultAction "phase:2,log,auditlog,pass"
