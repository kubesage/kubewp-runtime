# OWASP CRS Setup for WordPress
# Enable WordPress exclusion rules to prevent false positives on wp-admin, wp-json, admin-ajax
SecAction "id:900130,phase:1,pass,t:none,nolog,setvar:tx.crs_exclusions_wordpress=1"

# Anomaly scoring thresholds (moderate - tune after observation)
SecAction "id:900100,phase:1,pass,t:none,nolog,setvar:tx.inbound_anomaly_score_threshold=10"
SecAction "id:900110,phase:1,pass,t:none,nolog,setvar:tx.outbound_anomaly_score_threshold=5"

# Paranoia level 1 (standard detection, fewer false positives)
SecAction "id:900000,phase:1,pass,t:none,nolog,setvar:tx.paranoia_level=1"

# Sampling percentage (100% initially)
SecAction "id:900400,phase:1,pass,t:none,nolog,setvar:tx.sampling_percentage=100"
