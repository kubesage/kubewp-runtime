upstream php-fpm {
    server unix:/var/run/php/php-fpm.sock;
}

server {
    listen 80;
    server_name _;
    root /var/www/html;
    index index.php index.html;

    # Security headers
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Favicon (avoid 404 log spam)
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Static files with long cache
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Block xmlrpc.php (common attack vector)
    location = /xmlrpc.php {
        deny all;
        return 403;
    }

    # Block access to sensitive WordPress files
    location ~* /(?:wp-config\.php|readme\.html|license\.txt|wp-config-kubewp\.php) {
        deny all;
        return 403;
    }

    # Block access to hidden files (except .well-known)
    location ~ /\.(?!well-known) {
        deny all;
        return 403;
    }

    # Page cache bypass logic (per D-05)
    set $skip_cache 0;

    # POST requests
    if ($request_method = POST) {
        set $skip_cache 1;
    }

    # URLs with query strings
    if ($query_string != "") {
        set $skip_cache 1;
    }

    # WordPress admin and login
    if ($request_uri ~* "/wp-admin/|/wp-login.php|/xmlrpc.php") {
        set $skip_cache 1;
    }

    # Logged-in users, commenters, WooCommerce (per D-05)
    if ($http_cookie ~* "comment_author|wordpress_[a-f0-9]+|wp-postpass|wordpress_logged_in|woocommerce_items_in_cart|woocommerce_cart_hash") {
        set $skip_cache 1;
    }

    # WordPress pretty permalinks
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # PHP-FPM via Unix socket
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass php-fpm;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_read_timeout 300s;

        # Page cache (per D-04)
        fastcgi_cache WORDPRESS;
        fastcgi_cache_valid 200 301 302 60m;
        fastcgi_cache_bypass $skip_cache;
        fastcgi_no_cache $skip_cache;
        fastcgi_cache_use_stale error timeout updating http_500 http_503;
        add_header X-Cache-Status $upstream_cache_status;
        add_header Cache-Control $page_cache_control;
    }

    # Platform health check (bypasses WordPress)
    location = /kubewp-health {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    # PHP-FPM status (internal only)
    location = /fpm-status {
        allow 127.0.0.1;
        deny all;
        fastcgi_pass php-fpm;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }
}
