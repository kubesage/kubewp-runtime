worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time ucs=$upstream_cache_status';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 256m;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # Page cache zone (per D-04, D-07)
    fastcgi_cache_path /var/cache/nginx levels=1:2 keys_zone=WORDPRESS:10m
                       inactive=60m max_size=512m;
    fastcgi_cache_key "$scheme$request_method$host$request_uri";

    # CDN-friendly Cache-Control map (per D-09, D-10)
    map $upstream_cache_status $page_cache_control {
        default "public, max-age=600, s-maxage=3600";
        BYPASS  "private, no-cache";
        ""      "private, no-cache";
    }

    include /etc/nginx/conf.d/*.conf;
}
